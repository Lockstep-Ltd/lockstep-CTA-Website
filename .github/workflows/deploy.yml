# Builds the site on every pull request, and deploys to Vercel production
# on every push to main.
#
# One-time setup (see README "Deployment"):
#   Add these as GitHub repository secrets:
#     VERCEL_TOKEN       - a Vercel access token
#     VERCEL_ORG_ID      - from .vercel/project.json after running `npx vercel link`
#     VERCEL_PROJECT_ID  - from the same file
#   In Vercel, turn off the automatic Git integration for this project so
#   the site isn't deployed twice.

name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Run one deploy at a time. Superseded pull request checks are cancelled,
# but a production deploy is always allowed to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_CLI_VERSION: 62.4.0

jobs:
  build:
    name: Check the site builds
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  deploy:
    name: Deploy to Vercel (production)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Pull Vercel project settings
        run: npx --yes vercel@${{ env.VERCEL_CLI_VERSION }} pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build
        run: npx --yes vercel@${{ env.VERCEL_CLI_VERSION }} build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        run: npx --yes vercel@${{ env.VERCEL_CLI_VERSION }} deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
